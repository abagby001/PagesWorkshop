    <main>
    <div class="container">
    <section class="resourceContainer">
        <h2 class="innerTitle">Photography Showcase</h2>
        <p class="section-description">A collection of custom photography projects and visual layouts.</p>

        <div class="photo-grid">

            <!-- Card 1: New Image Showcase 1 -->
            <div class="photo-card" onclick="openLightbox('images/IMG_1600.JPG', 'Bird sitting on a wooden post')">
                <img src="images/IMG_1600.JPG" alt="Bird sitting on a wooden post">
            </div>

            <!-- Card 2: New Image Showcase 2 -->
            <div class="photo-card" onclick="openLightbox('images/IMG_2005.JPG', 'Scenic Sunset over the Coast')">
                <img src="images/IMG_2005.JPG" alt="Scenic Sunset over the Coast">
            </div>

            <!-- Card 3: Hibiscus flower in bloom -->
            <div class="photo-card" onclick="openLightbox('images/IMG_6424.PNG', 'Golden Moon')">
                <img src="images/IMG_6424.PNG" alt="Hibiscus flower in bloom">
            </div>

            <!-- Card 4: Dramatic Sunset Cloud Capture -->
            <div class="photo-card" onclick="openLightbox('images/IMG_0195.PNG', 'Dramatic Sunset Clouds')">
                <img src="images/IMG_0195.PNG" alt="Dramatic Sunset Clouds">
            </div>

            <!-- Card 5: Rain Over Universal Studios -->
            <div class="photo-card" onclick="openLightbox('images/IMG_3176.jpg', 'Rain Over Universal Studios')">
                <img src="images/IMG_3176.jpg" alt="Rain Over Universal Studios">
            </div>

            <!-- Card 6: Electric Rose -->
            <div class="photo-card" onclick="openLightbox('images/IMG_2002.jpeg', 'Electric Rose')">
                <img src="images/IMG_2002.jpeg" alt="Electric Rose">
            </div>

        </div>
    </section>


        </div>
